<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas — A Field Guide to Every Nation</title>
  <meta name="description" content="Browse, search, and filter every country in the world, powered by the REST Countries API." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,550;9..144,650;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grid-overlay" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <div class="wordmark">
        <span class="wordmark-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="12" r="9.5" />
            <path d="M15.5 8.5 12.8 12.8 8.5 15.5l2.7-4.3 4.3-2.7Z" fill="currentColor" stroke="none" />
          </svg>
        </span>
        <div>
          <h1>Atlas</h1>
          <p class="tagline">A field guide to every nation</p>
        </div>
      </div>

      <div class="header-meta">
        <span class="meta-label">Indexed</span>
        <span class="meta-value" id="countryCount">—</span>
      </div>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="Search and filter countries">
      <label class="control search-control" for="searchInput">
        <svg class="control-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" stroke-linecap="round" />
        </svg>
        <input
          type="text"
          id="searchInput"
          placeholder="Search by country name…"
          autocomplete="off"
          spellcheck="false"
        />
      </label>

      <label class="control select-control" for="regionSelect">
        <svg class="control-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9" />
          <path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9s1.3-6.4 3.8-9Z" />
        </svg>
        <select id="regionSelect">
          <option value="all">All regions</option>
        </select>
        <svg class="chevron-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </label>
    </section>

    <section class="results" aria-live="polite" aria-busy="false">
      <!-- Skeleton loading state -->
      <div id="skeletonGrid" class="grid skeleton-grid">
        <div class="card skeleton"><div class="skel-flag"></div><div class="skel-body"><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-line w50"></div><div class="skel-line w35"></div></div></div>
        <div class="card skeleton"><div class="skel-flag"></div><div class="skel-body"><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-line w50"></div><div class="skel-line w35"></div></div></div>
        <div class="card skeleton"><div class="skel-flag"></div><div class="skel-body"><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-line w50"></div><div class="skel-line w35"></div></div></div>
        <div class="card skeleton"><div class="skel-flag"></div><div class="skel-body"><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-line w50"></div><div class="skel-line w35"></div></div></div>
        <div class="card skeleton"><div class="skel-flag"></div><div class="skel-body"><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-line w50"></div><div class="skel-line w35"></div></div></div>
        <div class="card skeleton"><div class="skel-flag"></div><div class="skel-body"><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-line w50"></div><div class="skel-line w35"></div></div></div>
        <div class="card skeleton"><div class="skel-flag"></div><div class="skel-body"><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-line w50"></div><div class="skel-line w35"></div></div></div>
        <div class="card skeleton"><div class="skel-flag"></div><div class="skel-body"><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-line w50"></div><div class="skel-line w35"></div></div></div>
      </div>

      <!-- Populated country grid -->
      <div id="countryGrid" class="grid" hidden></div>

      <!-- Empty / no results state -->
      <div id="emptyState" class="state-panel" hidden>
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m20 20-4.35-4.35M8 10.5h5" stroke-linecap="round" />
        </svg>
        <h2 id="emptyTitle">No countries found</h2>
        <p id="emptyMessage">Try a different name or clear the region filter.</p>
        <button type="button" id="clearFiltersBtn" class="btn">Clear filters</button>
      </div>

      <!-- Error state -->
      <div id="errorState" class="state-panel" hidden>
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 9v4M12 17h.01" stroke-linecap="round" />
          <path d="M10.3 3.86 1.8 18a1.6 1.6 0 0 0 1.37 2.4h17.66A1.6 1.6 0 0 0 22.2 18L13.7 3.86a1.6 1.6 0 0 0-2.77 0Z" />
        </svg>
        <h2>Couldn't load the atlas</h2>
        <p id="errorMessage">Something went wrong while reaching the REST Countries API.</p>
        <button type="button" id="retryBtn" class="btn">Try again</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Data sourced from the <a href="https://restcountries.com" target="_blank" rel="noopener noreferrer">REST Countries API</a></p>
  </footer>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-flag">
        <img class="flag-img" alt="" loading="lazy" />
      </div>
      <div class="card-body">
        <h2 class="card-name"></h2>
        <dl class="card-meta">
          <div class="meta-row">
            <dt>Population</dt>
            <dd class="pop-value"></dd>
          </div>
          <div class="meta-row">
            <dt>Region</dt>
            <dd class="region-cell"><span class="region-dot"></span><span class="region-value"></span></dd>
          </div>
          <div class="meta-row">
            <dt>Capital</dt>
            <dd class="capital-value"></dd>
          </div>
        </dl>
      </div>
    </article>
  </template>

  <script src="script.js?v=3"></script>
</body>
</html>
